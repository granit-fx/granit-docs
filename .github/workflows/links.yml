name: External links

# starlight-links-validator covers internal links at build time; this weekly
# job catches external links that rot after publication.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: Check external links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --scheme https --scheme http
            --accept '200..=206,429'
            --max-concurrency 8
            'src/content/docs/**/*.md'
            'src/content/docs/**/*.mdx'
          fail: true
