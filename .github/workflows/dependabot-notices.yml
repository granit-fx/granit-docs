name: Dependabot notices

# Keeps THIRD-PARTY-NOTICES.md in sync on Dependabot PRs. Dependabot bumps deps
# without regenerating the notices file, which breaks the freshness check in the
# main CI on develop and on every open PR. This workflow regenerates the file and
# commits it back to the Dependabot PR branch, so develop never merges a stale copy.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]

permissions:
  contents: write

concurrency:
  group: dependabot-notices-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notices:
    name: Regenerate notices
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate third-party notices
        run: node scripts/generate-third-party-notices.mjs

      - name: Commit if changed
        run: |
          # -I ignores the daily "Last generated" stamp so a date-only diff does
          # not create a pointless commit; only real dependency changes are pushed.
          if git diff -I '^Last generated:' --quiet THIRD-PARTY-NOTICES.md; then
            echo "THIRD-PARTY-NOTICES.md already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add THIRD-PARTY-NOTICES.md
          git commit -m "chore(deps): regenerate THIRD-PARTY-NOTICES [skip ci]"
          git push
