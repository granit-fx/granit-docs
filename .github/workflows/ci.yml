name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Must stay a bare major: pinning an exact patch (e.g. 22.12) installs
          # that release's bundled corepack, whose npm signing keys are expired
          # and fail `corepack enable` with "Cannot find matching keyid".
          # The latest 22.x is >= 22.12.0, which is what Astro 7 requires.
          node-version: 22

      - name: Install pnpm
        run: corepack enable

      - name: Get pnpm store dir
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Markdown lint
        run: pnpm lint

      - name: Spell check
        run: pnpm spell

      - name: Third-party notices up to date
        # Dependabot PRs are auto-fixed by the dependabot-notices workflow, which
        # commits the regenerated file back to the PR branch. Enforcing the check
        # here would fail before that commit lands, so skip it for that actor.
        if: github.actor != 'dependabot[bot]'
        run: |
          node scripts/generate-third-party-notices.mjs
          # -I: the "Last generated" stamp changes every day; only real
          # dependency changes should fail this check.
          git diff -I '^Last generated:' --exit-code THIRD-PARTY-NOTICES.md

      - name: Build (Astro)
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: dist
          path: dist
          retention-days: 7
