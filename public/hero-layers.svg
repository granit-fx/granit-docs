<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" fill="none">
  <defs>
    <linearGradient id="gc" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#5b21b6"/></linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c4b5fd"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient>

    <filter id="shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2e1065" flood-opacity="0.25"/>
    </filter>

    <path id="h" d="M36,0 18,31.2 -18,31.2 -36,0 -18,-31.2 18,-31.2Z"/>
    <path id="hs" d="M30,0 15,26 -15,26 -30,0 -15,-26 15,-26Z"/>
  </defs>

  <g filter="url(#shadow)" transform="translate(258, 215)">

    <!-- Core -->
    <g transform="translate(-8, -6)">
      <use href="#h" fill="url(#gc)" opacity="0.95"/>
      <use href="#h" fill="none" stroke="#a78bfa" stroke-width="0.7" opacity="0.35"/>
    </g>

    <!-- Inner cluster — filled -->
    <g transform="translate(56, -14)">
      <use href="#h" fill="url(#g1)" opacity="0.92"/>
      <use href="#h" fill="none" stroke="#a78bfa" stroke-width="0.5" opacity="0.25"/>
    </g>
    <g transform="translate(22, -56)">
      <use href="#h" fill="url(#g1)" opacity="0.9"/>
      <use href="#h" fill="none" stroke="#a78bfa" stroke-width="0.5" opacity="0.25"/>
    </g>
    <g transform="translate(-40, -50)">
      <use href="#h" fill="url(#g1)" opacity="0.88"/>
      <use href="#h" fill="none" stroke="#a78bfa" stroke-width="0.5" opacity="0.25"/>
    </g>
    <g transform="translate(-70, -2)">
      <use href="#h" fill="url(#g1)" opacity="0.9"/>
      <use href="#h" fill="none" stroke="#a78bfa" stroke-width="0.5" opacity="0.25"/>
    </g>
    <g transform="translate(-36, 46)">
      <use href="#h" fill="url(#g1)" opacity="0.88"/>
      <use href="#h" fill="none" stroke="#a78bfa" stroke-width="0.5" opacity="0.25"/>
    </g>

    <!-- Second ring — mix filled + outline-only -->
    <g transform="translate(114, -40)">
      <use href="#h" fill="url(#g2)" opacity="0.82"/>
      <use href="#h" fill="none" stroke="#c4b5fd" stroke-width="0.4" opacity="0.2"/>
    </g>
    <g transform="translate(82, -78)">
      <use href="#hs" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.5"/>
    </g>
    <g transform="translate(18, -108)">
      <use href="#h" fill="url(#g2)" opacity="0.75"/>
      <use href="#h" fill="none" stroke="#c4b5fd" stroke-width="0.4" opacity="0.2"/>
    </g>
    <g transform="translate(-78, -90)">
      <use href="#hs" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.45"/>
    </g>
    <g transform="translate(-120, -36)">
      <use href="#h" fill="url(#g2)" opacity="0.78"/>
      <use href="#h" fill="none" stroke="#c4b5fd" stroke-width="0.4" opacity="0.2"/>
    </g>
    <g transform="translate(-100, 44)">
      <use href="#hs" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.4"/>
    </g>
    <g transform="translate(30, 52)">
      <use href="#h" fill="url(#g2)" opacity="0.8"/>
      <use href="#h" fill="none" stroke="#c4b5fd" stroke-width="0.4" opacity="0.2"/>
    </g>
    <g transform="translate(88, 28)">
      <use href="#hs" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.45"/>
    </g>

    <!-- Outer — mostly outline, some filled ghost -->
    <g transform="translate(160, 10)">
      <use href="#hs" fill="none" stroke="#c4b5fd" stroke-width="0.8" opacity="0.35"/>
    </g>
    <g transform="translate(140, -86)">
      <use href="#hs" fill="url(#g3)" opacity="0.35"/>
      <use href="#hs" fill="none" stroke="#c4b5fd" stroke-width="0.4" opacity="0.15"/>
    </g>
    <g transform="translate(60, -140)">
      <use href="#hs" fill="none" stroke="#c4b5fd" stroke-width="0.8" opacity="0.3"/>
    </g>
    <g transform="translate(-46, -132)">
      <use href="#hs" fill="url(#g3)" opacity="0.3"/>
      <use href="#hs" fill="none" stroke="#c4b5fd" stroke-width="0.4" opacity="0.15"/>
    </g>
    <g transform="translate(-152, -72)">
      <use href="#hs" fill="none" stroke="#c4b5fd" stroke-width="0.8" opacity="0.28"/>
    </g>
    <g transform="translate(-148, 20)">
      <use href="#hs" fill="none" stroke="#ddd6fe" stroke-width="0.7" opacity="0.25"/>
    </g>
    <g transform="translate(-60, 86)">
      <use href="#hs" fill="none" stroke="#c4b5fd" stroke-width="0.8" opacity="0.32"/>
    </g>
    <g transform="translate(68, 82)">
      <use href="#hs" fill="url(#g3)" opacity="0.25"/>
      <use href="#hs" fill="none" stroke="#c4b5fd" stroke-width="0.4" opacity="0.15"/>
    </g>
    <g transform="translate(142, 56)">
      <use href="#hs" fill="none" stroke="#ddd6fe" stroke-width="0.7" opacity="0.22"/>
    </g>
    <!-- Extra distant outlines -->
    <g transform="translate(-116, -118)">
      <use href="#hs" fill="none" stroke="#ddd6fe" stroke-width="0.6" opacity="0.18"/>
    </g>
    <g transform="translate(178, -50)">
      <use href="#hs" fill="none" stroke="#ddd6fe" stroke-width="0.6" opacity="0.18"/>
    </g>
    <g transform="translate(10, 96)">
      <use href="#hs" fill="none" stroke="#ddd6fe" stroke-width="0.6" opacity="0.2"/>
    </g>
  </g>
</svg>
